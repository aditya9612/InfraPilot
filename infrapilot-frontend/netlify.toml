[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  CI = "false"
  VITE_API_URL = "https://infrapilot.in/api/v1"

# API proxy removed - VITE_API_URL now points directly to https://infrapilot.in/api/v1

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
