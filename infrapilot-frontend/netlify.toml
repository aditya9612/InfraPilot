[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  CI = "false"
  VITE_API_URL = "/api/v1"

[[redirects]]
  from = "/api/*"
  to = "https://infrapilot.in/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
